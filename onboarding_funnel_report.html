<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온보딩 메인스텝 퍼널 분석</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --blue:#2a78d6; --blue-soft:#86b6ef; --orange:#eb6834;
  --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --good:#0ca30c;
  --tooltip-bg:#0b0b0b; --tooltip-ink:#fcfcfb;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --blue:#3987e5; --blue-soft:#1c5cab; --orange:#d95926;
  --tooltip-bg:#fcfcfb; --tooltip-ink:#0b0b0b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --blue:#3987e5; --blue-soft:#1c5cab; --orange:#d95926;
    --tooltip-bg:#fcfcfb; --tooltip-ink:#0b0b0b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 72px}
@media (min-width:1400px){.wrap{max-width:1240px}}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}
h1{font-size:22px;font-weight:700;margin:0}
.meta{color:var(--muted);font-size:12.5px}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;flex-shrink:0}
.theme-btn:hover{color:var(--ink)}
h2{font-size:16px;font-weight:700;margin:40px 0 14px}
h1 .help{width:17px;height:17px;font-size:11.5px;top:-2px}
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:7px;
  border:1px solid var(--border);border-radius:50%;color:var(--muted);font-size:10.5px;font-weight:600;
  cursor:help;vertical-align:middle;position:relative;top:-1px}
.help:hover{color:var(--ink);border-color:var(--baseline)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.tile .label{font-size:12.5px;color:var(--ink-2)}
.tile .value{font-size:30px;font-weight:600;margin-top:2px}
.tile .note{font-size:12px;color:var(--muted);margin-top:2px}
.tile .value .unit{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:2px}
/* chart */
.chart-scroll{overflow-x:auto;padding-bottom:4px}
.chart-inner{width:100%}
.panel-title{font-size:12.5px;color:var(--ink-2);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.key{display:inline-block;width:10px;height:10px;border-radius:3px}
svg text{font-family:inherit}
.axis-t{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.dlabel{fill:var(--ink-2);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cp-t{fill:var(--muted);font-size:10px}
.tooltip{position:fixed;z-index:10;pointer-events:none;background:var(--tooltip-bg);color:var(--tooltip-ink);
  border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.5;max-width:300px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transition:opacity .08s}
.tooltip b{font-weight:700}
.tooltip .tt-muted{opacity:.65}
/* segment bars */
.segs{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:150px 1fr 170px;align-items:center;gap:12px}
.seg .name{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg .track{height:16px;background:transparent;position:relative;border-radius:4px}
.seg .track::before{content:"";position:absolute;inset:0;border-radius:4px;background:var(--grid);opacity:.5}
.seg .fill{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--orange);min-width:2px}
.seg .val{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.seg .val b{color:var(--ink);font-weight:600}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.stepcode{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted))}
.b-crit{--dot:var(--critical);color:var(--ink);font-weight:600}
.b-ser{--dot:var(--serious)}
.b-warn{--dot:var(--warning)}
.b-zero{--dot:var(--grid);color:var(--muted)}
.ratebar{display:inline-block;height:8px;border-radius:4px 4px 4px 4px;background:var(--orange);vertical-align:middle;min-width:2px}
.rowbar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--blue);vertical-align:middle;min-width:2px}
.rowval{font-size:11.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;vertical-align:middle}
tr.hl td{background:color-mix(in srgb, var(--critical) 7%, transparent)}
/* callout */
.callout{border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;
  background:var(--surface);padding:12px 16px;font-size:13px;color:var(--ink-2);margin-top:14px}
.callout b{color:var(--ink)}
.callout.warn{border-left-color:var(--warning)}
/* details */
details{margin-top:8px}
details summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:10px 0;user-select:none;list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"▸";font-size:11px;color:var(--muted);transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details summary:hover{color:var(--ink)}
details.excl{margin-top:40px}
details.excl>summary{font-size:16px;font-weight:700;color:var(--ink);padding:0 0 12px}
details.excl>summary::before{font-size:12px}
.tbl-scroll{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--border);border-radius:999px;padding:1px 9px;color:var(--ink-2);white-space:nowrap}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--grid);color:var(--muted);font-size:12px;line-height:1.7}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta{margin-top:6px}
/* date filter */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:18px}
.dblabel{font-size:12px;color:var(--muted);margin-right:2px}
.dbsep{width:1px;height:16px;background:var(--border);margin:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:4px 11px;cursor:pointer;user-select:none;font-family:inherit}
.chip:hover{color:var(--ink);border-color:var(--baseline)}
.chip .n{font-size:11px;opacity:.6}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on .n{opacity:.75}
.chip.q{color:var(--muted);font-size:12px;padding:4px 10px}
.chip.q:hover{color:var(--ink)}
</style>
</head>

    <h1>온보딩 메인스텝 퍼널 분석<span class="help" id="h1tip" data-tip="">?</span></h1>

  </div>
  <div class="hdr-actions">

  </div>

  <p class="panel-title" style="margin-top:14px"><span class="key" style="background:var(--orange)"></span>스텝 이탈율 (%)</p>
  <div class="chart-scroll"><div class="chart-inner" id="churnChart"></div></div>
</div>

<h2>이탈율이 높은 스텝 TOP 10<span class="help" data-tip="이탈 인원 기준 상위 10개 스텝. 이탈율은 해당 스텝 진입자(직전 스텝 완료자) 대비 비율입니다.">?</span></h2>
<div class="card tbl-scroll"><table id="topTable"></table></div>

<h2>전체 스텝 상세 (설명 + 그래프)<span class="help" id="fullTip" data-tip="">?</span></h2>
<div class="card">
  <div class="tbl-scroll"><table id="fullTable"></table></div>
</div>

<details class="excl">
  <summary id="exclSummary"></summary>
<div class="card tbl-scroll"><table id="exclTable"></table></div>
</details>

</div>
</div>

<div class="tooltip" id="tt"></div>

// ---------- helpers ----------
const pct=v=>v.toFixed(1).replace(/\.0$/,'')+'%';
const SP=()=>CONFIG.stepPrefix===undefined?'step ':CONFIG.stepPrefix;
const numCmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
function sevClass(r){ if(r>=20) return 'b-crit'; if(r>=8) return 'b-ser'; if(r>0) return 'b-warn'; return 'b-zero'; }
function sevLabel(r){ if(r>=20) return '심각'; if(r>=8) return '높음'; if(r>0) return '주의'; return '—'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function niceStep(x){ if(!(x>0)) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(x))), n=x/p;
  const m = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=3?3 : n<=5?5 : 10;
  return m*p; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ---------- CSV ----------
function stepKey(detail){
  let k=null;
  if(CONFIG.stepKeyPattern){ const m=new RegExp(CONFIG.stepKeyPattern).exec(detail); if(m) k=m[1]; }
  if(k==null){ const p=String(detail).split(' or '); k=(p[p.length-1]||detail).trim(); }
  return (CONFIG.rename&&CONFIG.rename[k])||k;
}
function parseCSV(text){
  const lines=text.replace(/^﻿/,'').trim().split(/\r?\n/);
  const head=lines[0].split(',').map(s=>s.trim());
  const iDet=head.indexOf('Step details'), iComp=head.indexOf('Step completion'),
        iChurn=head.indexOf('Churn'), iTot=head.indexOf('Total completion');
  if(iDet<0||iComp<0||iTot<0) throw new Error('CSV 헤더에 Step details / Step completion / Total completion 이 필요합니다.');
  const rows=lines.slice(1).filter(l=>l.trim()).map(l=>{
    const c=l.split(',');
    return { num: stepKey(c[iDet]||''), comp:parseFloat(c[iComp]),
             churn: iChurn>=0? parseFloat(c[iChurn]) : 0, total:parseFloat(c[iTot]) };
  });
  if(!rows.length) throw new Error('데이터 행이 없습니다.');
  return rows;
}
function inferStart(rows){
  const totals=rows.map(r=>r.total).filter(t=>t>0);
  if(!totals.length) return 0;
  for(let N=2;N<=5000;N++){
    let ok=true;
    for(const t of totals){ const v=t*N/100; if(Math.abs(v-Math.round(v))>0.055){ ok=false; break; } }
    if(ok) return N;
  }
  return 100;
}
// GA 내보내기는 % 포맷과 인원수 포맷 두 가지가 있다.
// % 포맷은 모든 행에서 (Step completion + Churn) == 100 이다.
function isPercentFormat(rows){
  const r=rows.filter(x=>x.comp>0);
  if(!r.length) return true;
  return r.every(x=>Math.abs(x.comp+(x.churn||0)-100)<0.05);
}
// CSV 한 장 -> {start, seq:[{num,comp,excl}], exact} (원본 순서 유지)
function toDataset(rows,startOverride){
  if(!isPercentFormat(rows)){                     // 인원수 포맷: 역산 불필요
    const start=startOverride||Math.round(rows[0]?rows[0].total:0);
    return {start, exact:true,
            seq:rows.map(r=>({num:r.num, comp:Math.round(r.total), excl:(r.comp===0&&r.total===0)}))};
  }
  const start=startOverride||inferStart(rows);
  return {start, exact:!!startOverride,
          seq:rows.map(r=>({num:r.num, comp:Math.round(r.total*start/100), excl:(r.comp===0&&r.total===0)}))};
}

// 여러 날짜 데이터셋 합산 -> 리포트용 DATA
function combine(dsets){
  const START=dsets.reduce((a,d)=>a+d.start,0);
  const order=[], comp=new Map(), churn=new Map(), flagged=new Set();
  dsets.forEach(d=>{
    let prev=d.start;
    d.seq.forEach(s=>{
      if(!comp.has(s.num)){ comp.set(s.num,0); order.push(s.num); }
      comp.set(s.num, comp.get(s.num)+s.comp);
      if(Object.prototype.hasOwnProperty.call(CONFIG.reason,s.num)){
        flagged.add(s.num); churn.set(s.num,(churn.get(s.num)||0)+Math.max(prev-s.comp,0));
      }
      prev=s.comp;
    });
  });
  const isExcl=n=>flagged.has(n)&&comp.get(n)===0;

  // GA는 마지막 스텝(예: 114) 뒤에 놓인 미발화 스텝에 완주자를 '이탈'로 흡수시킨다.
  // 이들은 온보딩 완료자이므로 이탈로 계상하지 않고 ghost 로만 보관한다.
  const excluded=order.filter(isExcl).sort(numCmp).map(n=>({
    num:n, desc:CONFIG.desc[n]||('main_step_'+n), reason:CONFIG.reason[n]||'미발화',
    comp:0, churn:0, ghost:churn.get(n)||0 }));

  const usedOrder=order.filter(n=>!isExcl(n));
  const SORTED = CONFIG.sortByStepNumber===false ? usedOrder : usedOrder.slice().sort(numCmp);
  const wins=[];
  for(let i=0;i<usedOrder.length-1;i++){
    if(numCmp(usedOrder[i],usedOrder[i+1])>0){
      const last=wins[wins.length-1];
      if(last && i<=last[1]) last[1]=i+1; else wins.push([i,i+1]);
    }
  }
  const reorderedNums=wins.map(([a,b])=>{
    const g=usedOrder.slice(a,b+1).slice().sort(numCmp);
    return g[0]===g[g.length-1]?g[0]:g[0]+'~'+g[g.length-1];
  });

  const steps=[]; let enter=START;
  SORTED.forEach((n,i)=>{
    const c=comp.get(n), ch=enter-c;
    steps.push({i:i+1, num:n, desc:CONFIG.desc[n]||('main_step_'+n),
                enter, comp:c, churn:ch, rate:enter?Math.round(ch/enter*1000)/10:0});
    enter=c;
  });
  const lastReal=steps.length?steps[steps.length-1]:null;
  // 마지막 스텝을 완료한 대상 = 온보딩 완료. 별도 스텝으로 한 칸 더 표기한다.
  const T=CONFIG.terminalStep;
  if(T && lastReal){
    steps.push({i:steps.length+1, num:T.num, desc:T.desc, terminal:true,
                enter:lastReal.comp, comp:lastReal.comp, churn:0, rate:0});
  }
  return {start:START, final:lastReal?lastReal.comp:0, lastRealNum:lastReal?lastReal.num:'—', steps, excluded,
          checkpoints:CONFIG.checkpoints, reordered:wins.length>0, reorderedNums,
          totalChurn:steps.reduce((a,s)=>a+s.churn,0)};
}

// ---------- charts ----------
const GAP=2, PAD_L=34, PAD_R=10, MIN_BW=6, MAX_BW=22;
const NS='http://www.w3.org/2000/svg';
function el(n,attrs){const e=document.createElementNS(NS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function barPath(x,BW,base,bh){
  const top=base-bh, rr=Math.min(3,bh,BW/2);
  return `M${x},${base} V${top+rr} Q${x},${top} ${x+rr},${top} H${x+BW-rr} Q${x+BW},${top} ${x+BW},${top+rr} V${base} Z`;
}
let D=null, cpSet=new Set(), lastBW=null;
function stepTT(s){
  if(s.terminal) return `<b>${SP()}${s.num}</b> · ${esc(s.desc)}<br>
  <span class="tt-muted">직전 스텝 완료</span> ${s.comp}명 = <b>온보딩 완주</b>`;
  return `<b>${SP()}${s.num}</b> · ${esc(s.desc)}<br>
  <span class="tt-muted">진입</span> ${s.enter}명 → <span class="tt-muted">완료</span> ${s.comp}명<br>
  <span class="tt-muted">이탈</span> ${s.churn}명 (${pct(s.rate)})${cpSet.has(s.num)?'<br><span class="tt-muted">◆ 체크포인트 스텝</span>':''}`;
}
function attach(hit,s){
  hit.addEventListener('mousemove',ev=>{showTT(ev,stepTT(s));});
  hit.addEventListener('mouseleave',hideTT);
}
function ticksFor(max,want,minStep){
  const st=Math.max(minStep||0,niceStep(max/want)), out=[];
  for(let v=0; v<=max+1e-9; v+=st) out.push(Math.round(v*100)/100);
  return out;
}
function drawMain(W,BW){
  const S=D.steps, START=D.start;
  const H=230, PT=18, PB=26, plotH=H-PT-PB;
  const svg=el('svg',{width:W,height:H});
  const y=v=>PT+plotH*(1-v/START);
  ticksFor(START,3,1).forEach(v=>{
    svg.appendChild(el('line',{x1:PAD_L,x2:W-PAD_R,y1:y(v),y2:y(v),
      stroke:v===0?'var(--baseline)':'var(--grid)','stroke-width':1}));
    const t=el('text',{x:PAD_L-6,y:y(v)+3.5,'text-anchor':'end',class:'axis-t'});
    t.textContent=v; svg.appendChild(t);
  });
  S.forEach((s,i)=>{
    const x=PAD_L+i*(BW+GAP), base=PT+plotH;
    const bh=Math.max(plotH*s.comp/START,1.5);
    svg.appendChild(el('path',{d:barPath(x,BW,base,bh),fill:'var(--blue)'}));
    const hit=el('rect',{x:x-GAP/2,y:PT,width:BW+GAP,height:plotH,fill:'transparent'});
    attach(hit,s); svg.appendChild(hit);
    if(cpSet.has(s.num)){
      const m=el('text',{x:x+BW/2,y:H-14,'text-anchor':'middle',class:'cp-t'});
      m.textContent='◆'; svg.appendChild(m);
      const l=el('text',{x:x+BW/2,y:H-3,'text-anchor':'middle',class:'axis-t'});
      l.textContent=s.num; svg.appendChild(l);
    } else if(i===0){
      const l=el('text',{x:x+BW/2,y:H-3,'text-anchor':'middle',class:'axis-t'});
      l.textContent=s.num; svg.appendChild(l);
    }
    if(i===0||i===S.length-1){
      const d=el('text',{x:x+BW/2,y:base-bh-5,'text-anchor':'middle',class:'dlabel'});
      d.textContent=s.comp; svg.appendChild(d);
    }
  });
  return svg;
}
function drawChurn(W,BW){
  const S=D.steps;
  const H=96, PT=14, PB=6, plotH=H-PT-PB;
  const peak=Math.max(10,...S.map(s=>s.rate));
  const st=niceStep(peak/2), MAX=Math.ceil(peak/st)*st;
  const svg=el('svg',{width:W,height:H});
  const y=v=>PT+plotH*(1-v/MAX);
  ticksFor(MAX,2).forEach(v=>{
    svg.appendChild(el('line',{x1:PAD_L,x2:W-PAD_R,y1:y(v),y2:y(v),
      stroke:v===0?'var(--baseline)':'var(--grid)','stroke-width':1}));
    const t=el('text',{x:PAD_L-6,y:y(v)+3.5,'text-anchor':'end',class:'axis-t'});
    t.textContent=v; svg.appendChild(t);
  });
  S.forEach((s,i)=>{
    const x=PAD_L+i*(BW+GAP), base=PT+plotH;
    if(s.rate>0){
      const bh=Math.max(plotH*Math.min(s.rate,MAX)/MAX,1.5);
      svg.appendChild(el('path',{d:barPath(x,BW,base,bh),fill:'var(--orange)'}));
      if(s.rate>=20){
        const d=el('text',{x:x+BW/2,y:base-bh-4,'text-anchor':'middle',class:'dlabel'});
        d.textContent=s.num; svg.appendChild(d);
      }
    }
    const hit=el('rect',{x:x-GAP/2,y:PT,width:BW+GAP,height:plotH,fill:'transparent'});
    attach(hit,s); svg.appendChild(hit);
  });
  return svg;
}
let retryN=0, retryQ=false;
function scheduleRetry(){
  if(retryQ || retryN++>120) return;
  retryQ=true;
  requestAnimationFrame(()=>{ retryQ=false; renderCharts(true); });
}
function renderCharts(force){
  if(!D) return;
  const mainHost=document.getElementById('mainChart');
  const churnHost=document.getElementById('churnChart');
  const avail=mainHost.parentElement.clientWidth||mainHost.clientWidth
              ||mainHost.getBoundingClientRect().width;
  if(!avail){ scheduleRetry(); return; }
  retryN=0;
  const N=D.steps.length; if(!N) return;
  let BW=(avail-PAD_L-PAD_R)/N-GAP;
  BW=Math.min(MAX_BW,Math.max(MIN_BW,BW));
  BW=Math.round(BW*100)/100;
  if(!force&&BW===lastBW) return;
  lastBW=BW;
  const W=Math.max(avail,PAD_L+PAD_R+N*(BW+GAP));
  mainHost.innerHTML=''; mainHost.appendChild(drawMain(W,BW));
  churnHost.innerHTML=''; churnHost.appendChild(drawChurn(W,BW));
}
let rzT; addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>renderCharts(false),120);});
addEventListener('load',()=>renderCharts(false));
addEventListener('pageshow',()=>renderCharts(false));

}

function render(data, period, srcLabel){

  const NREAL=S.filter(s=>!s.terminal).length;

  document.getElementById('h1tip').dataset.tip =
    `기준일 ${period} · GA 퍼널 데이터 · 시작 유저 ${START}명 · 사용 스텝 ${NREAL}종 (전체 ${CONFIG.totalStepCount}종 중, 설계 기준)`;
  document.getElementById('fullTip').dataset.tip =
    `사용 스텝 ${NREAL}종의 설명과 수치를 한눈에 볼 수 있는 표입니다. 파란 막대는 잔존 유저 수(시작 ${START}명 대비), 주황 막대는 해당 스텝 이탈율입니다. ◆는 체크포인트 스텝입니다.`;
  document.getElementById('srcMeta').textContent = srcLabel? `${period} · ${srcLabel}` : period;

  document.getElementById('kpis').innerHTML=`
  <div class="tile"><div class="label">시작 유저</div><div class="value">${START}<span class="unit">명</span></div></div>
  <div class="tile"><div class="label">${CONFIG.finalTileLabel||`온보딩 완료 (step ${D.lastRealNum} 완료)`}</div><div class="value">${FINAL}<span class="unit">명</span></div><div class="note">완주율 ${pct(START?FINAL/START*100:0)}</div></div>`;

  document.getElementById('loadErr').hidden=true;
  document.getElementById('report').hidden=false;   // 폭 계산을 위해 차트보다 먼저 노출
  renderCharts(true);

  const top10=S.filter(s=>!s.terminal).sort((a,b)=>b.churn-a.churn||b.rate-a.rate).slice(0,10);
  const maxRate=Math.max(...top10.map(s=>s.rate),0.1);
  document.getElementById('topTable').innerHTML=
   `<thead><tr><th>#</th><th>스텝</th><th>설명</th><th class="num">진입</th><th class="num">완료</th><th class="num">이탈</th><th class="num">이탈율</th><th style="width:120px"></th><th>수준</th></tr></thead><tbody>`+
   top10.map((s,i)=>`<tr${i===0?' class="hl"':''}>
     <td class="num">${i+1}</td>
     <td class="stepcode">${SP()}${s.num}${cpSet.has(s.num)?' ◆':''}</td>
     <td>${esc(s.desc)}</td>
     <td class="num">${s.enter}</td><td class="num">${s.comp}</td>
     <td class="num"><b>${s.churn}</b></td><td class="num">${pct(s.rate)}</td>
     <td><span class="ratebar" style="width:${Math.round(s.rate/maxRate*110)}px"></span></td>
     <td><span class="badge ${sevClass(s.rate)}">${sevLabel(s.rate)}</span></td>
   </tr>`).join('')+`</tbody>`;

  document.getElementById('fullTable').innerHTML=
   `<thead><tr><th class="num">순서</th><th>스텝</th><th>설명</th><th class="num">진입</th><th style="width:170px">완료(잔존) 유저</th><th class="num">이탈</th><th class="num">이탈율</th></tr></thead><tbody>`+
   S.map(s=>`<tr${!s.terminal&&s.rate>=20?' class="hl"':''}>
     <td class="num" style="color:var(--muted)">${s.i}</td>
     <td class="stepcode">${SP()}${s.num}${cpSet.has(s.num)?' ◆':''}</td>
     <td>${esc(s.desc)}</td>
     <td class="num">${s.enter}</td>
     <td style="white-space:nowrap"><span class="rowbar" style="width:${(s.comp/START*120).toFixed(1)}px"></span><span class="rowval">${s.comp}</span></td>
     <td class="num">${s.terminal?'<span style="color:var(--muted)">—</span>':(s.churn>0?`<span class="badge ${sevClass(s.rate)}">${s.churn}</span>`:'<span style="color:var(--muted)">0</span>')}</td>
     <td class="num">${s.terminal?'<span style="color:var(--muted)">—</span>':(s.churn>0?pct(s.rate):'<span style="color:var(--muted)">—</span>')}</td>
   </tr>`).join('')+`</tbody>`;

  const EX=D.excluded;
  const exclBox=document.querySelector('details.excl');
  if(exclBox) exclBox.hidden = EX.length===0;
  document.getElementById('exclSummary').innerHTML=
   `퍼널 분석에 포함되지 않는 스텝 (${EX.length}종)<span class="help" data-tip="GA 퍼널 정의에는 포함되어 있으나 이벤트가 발화하지 않아(설계상 제외 스텝) 분석에서 제외한 ${EX.length}종입니다. 제외 사유는 퍼널 이벤트 설계안 기준입니다.">?</span>`;
  document.getElementById('exclTable').innerHTML=
   `<thead><tr><th>스텝</th><th>설명</th><th>제외 사유</th><th class="num">완료</th><th class="num">이탈</th></tr></thead><tbody>`+
   EX.map(e=>`<tr>
     <td class="stepcode">${SP()}${e.num}</td>
     <td>${esc(e.desc)}</td>
     <td><span class="pill">${esc(e.reason)}</span></td>
     <td class="num">${e.comp}</td>
     <td class="num"><span style="color:var(--muted)">${e.churn}</span></td>
   </tr>`).join('')+`</tbody>`;

  bindHelp();
}

// ---------- date filter ----------
const SOURCES=[];        // {key, label, dataset, adhoc}
let selected=new Set();

function periodLabel(recs){
  const fr=recs.map(r=>r.from).filter(Boolean).sort()[0];
  const to=recs.map(r=>r.to).filter(Boolean).sort().pop();
  if(!fr||!to) return recs.map(r=>r.label).join(', ');
  const base = fr===to? fr : `${fr} ~ ${to}`;
  return recs.length>1? `${base} (${recs.length}일)` : base;
}
function apply(){
  const picked=SOURCES.filter(s=>selected.has(s.key));
  if(!picked.length){ fail('선택된 날짜가 없습니다.'); return; }
  try{
    render(combine(picked.map(s=>s.dataset)), periodLabel(picked),
           picked.length===1? '' : `${picked.length}개 날짜 합산`);
  }catch(e){ fail(e.message); }
  drawBar();
}
function drawBar(){
  const bar=document.getElementById('datebar');
  if(SOURCES.length<=1){ bar.hidden=true; return; }
  bar.hidden=false;
  const list=[...SOURCES].sort((a,b)=>a.key.localeCompare(b.key));
  bar.innerHTML=
    `<span class="dblabel">날짜</span>`+
    list.map(s=>`<button class="chip${selected.has(s.key)?' on':''}" data-k="${esc(s.key)}">${esc(s.label)}<span class="n">${s.dataset.start}명</span></button>`).join('')+
    `<span class="dbsep"></span>`+
    `<button class="chip q" data-q="all">전체</button>`;
  bar.querySelectorAll('.chip[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(selected.has(k)){ if(selected.size>1) selected.delete(k); } else selected.add(k);
    apply();
  });
  bar.querySelectorAll('.chip[data-q]').forEach(b=>b.onclick=()=>{
    selected=new Set(SOURCES.map(s=>s.key)); apply();
  });
}
function addSource(spec,rows){
  SOURCES.push({key:spec.key, label:spec.label||spec.key, from:spec.from, to:spec.to,
                dataset:toDataset(rows,spec.start)});
}
function fail(msg){
  const e=document.getElementById('loadErr');
  e.hidden=false; e.innerHTML=`<b>데이터를 표시하지 못했습니다.</b> ${esc(msg)}`;
  document.getElementById('srcMeta').textContent='데이터 없음';
  document.getElementById('report').hidden=true;
}

// ---------- 부트 ----------
(function(){
  document.getElementById('tags').innerHTML=(CONFIG.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('');
  DATASETS.forEach(d=>{
    try{ addSource(d, parseCSV(d.text)); }
    catch(e){ console.warn('데이터셋 파싱 실패:', d.key, e.message); }
  });
  if(!SOURCES.length){ fail('DATASETS 가 비어 있거나 형식이 올바르지 않습니다.'); return; }
  const want=(new URLSearchParams(location.search).get('dates')||'').split(',').map(v=>v.trim()).filter(Boolean);
  const valid=want.filter(k=>SOURCES.some(s=>s.key===k));
  selected=new Set(valid.length?valid:SOURCES.map(s=>s.key));
  apply();
})();
bindHelp();
</script>
