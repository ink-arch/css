.phone.focus .view{transform:none}   /* 상단 재화 HUD 잘림 방지: 확대/이동 없음 */

/* interaction icon */
.hot{position:absolute;left:21%;top:34%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:rgba(20,26,32,.82);border:2px solid var(--gold);
  display:grid;place-items:center;cursor:pointer;animation:bob 1.5s ease-in-out infinite}
.hot img{width:24px;height:24px}
.hot::after{content:"";position:absolute;inset:-8px;border-radius:50%;
  border:2px solid var(--gold);opacity:.45;animation:ring 1.5s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.35);opacity:0}}
.phone.open .hot{display:none}

/* ---------- sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(#1d232b,#141920);
  border-top:2px solid #3a434f;border-radius:16px 16px 0 0;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -14px 30px rgba(0,0,0,.55);
  padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.phone.open .sheet{transform:translateY(0)}
.srow{display:flex;align-items:center;gap:10px}
.ttl{font-size:13px;font-weight:800;color:#e7d5ab}
.x{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid #3a434f;
  background:#232a33;color:#c3ccd8;font-size:14px;cursor:pointer;line-height:1}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:7px 0;border-radius:7px;border:1px solid #3a434f;background:#232a33;
  color:#98a3b1;font-size:12px;font-weight:800;cursor:pointer;position:relative}
.tabs button.on{background:var(--wood);border-color:#a9793f;color:#ffeccd}
.badge{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--red)}

.strip{display:flex;gap:7px}
.slot{position:relative;width:56px;height:56px;border-radius:9px;background:#20262e;
  border:2px solid #39424e;display:grid;place-items:center;cursor:pointer}
.slot img{width:36px;height:36px;object-fit:contain}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,201,92,.25)}
.slot.lock img{filter:grayscale(1) brightness(.5)}
.slot .lk{position:absolute;right:3px;bottom:3px;width:15px;height:15px}
.slot .rd{position:absolute;right:-3px;top:-3px;width:11px;height:11px}
.slot .eq{position:absolute;left:3px;top:3px;font-size:8px;font-weight:800;color:#20180a;
  background:var(--gold);border-radius:3px;padding:1px 3px}
.slot .tmp{position:absolute;left:2px;bottom:2px;font-size:7px;color:#ffd479;
  background:rgba(0,0,0,.6);border-radius:3px;padding:0 3px}

.name{font-size:14px;font-weight:800}
.name small{font-weight:600;color:var(--muted);margin-left:6px;font-size:11px}
.stats{display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding-right:2px}
.stat{display:grid;grid-template-columns:20px 1fr auto auto;align-items:center;gap:7px;
  background:#1b212a;border:1px solid #2d3540;border-radius:7px;padding:5px 7px;font-size:12px}
.stat>img{width:20px;height:20px}
.stat .lb{color:#aab4c1;line-height:1.25}
.stat .lb i{display:block;font-style:normal;font-size:9px;font-weight:700;color:var(--muted)}
.stat .vl{font-weight:800;text-align:right}
.stat .vl b{color:var(--green)}
.ub{display:flex;align-items:center;gap:3px;padding:5px 8px;border-radius:6px;border:0;cursor:pointer;
  font-size:11px;font-weight:800;background:linear-gradient(#f0b64a,#c9862a);color:#2a1c05;white-space:nowrap}
.ub img{width:13px;height:13px}
.ub.lack{background:linear-gradient(#7d6a4a,#5c4a2c);color:#ffd7d7}
.ub:disabled{opacity:.45;cursor:default}
.ub.maxed{background:#2a323d;color:#8d97a5}
.fix{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.cost{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800}
.cost img{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
.cost .lack{color:var(--red)}
.cond{font-size:11px;color:#ffb3b3}
.act{margin-top:auto;width:100%;padding:11px 0;border-radius:9px;border:0;cursor:pointer;
  font-size:14px;font-weight:800;background:linear-gradient(#f0b64a,#c9862a);color:#2a1c05}
.act:disabled{opacity:.45;cursor:default}
.act.unlock{background:linear-gradient(#7fc7ff,#3b8fd6);color:#08202f}

/* ---------- bottom bar (scene B) ---------- */
.barmask{position:absolute;left:0;right:0;bottom:0;height:110px;
  background:linear-gradient(rgba(58,66,74,0) 0%, #3c444c 26%, #3a4249 100%)}
.bar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;
  gap:6px;align-items:flex-end}
.dia{position:relative;width:60px;height:60px;display:grid;place-items:center;cursor:default}
.dia img.fr{position:absolute;inset:0;width:100%;height:100%}
.dia img.ic{width:28px;height:28px;position:relative;z-index:1}
.dia.act4{cursor:pointer}
.dia.act4.disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.dia .rd{position:absolute;right:2px;top:4px;width:11px;height:11px;z-index:2}
.fan{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);display:flex;
  flex-direction:column-reverse;gap:9px;opacity:0;pointer-events:none;transition:.22s}
.fan.on{opacity:1;pointer-events:auto}
.fan .dia{width:52px;height:52px}
.fan .dia img.ic{width:24px;height:24px}
.lbl{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:8px;
  font-weight:800;color:#e7d5ab;text-shadow:0 1px 2px #000;z-index:2}

.hide{display:none}
</style>

         {lb:"생산 주기",v:60,unit:"s",inc:-10,dec:0,lv:2,max:5,cost:[400,1]}]}
];
const GOLD=1240, ORE=8;              /* 보유 재화 — 상단 HUD에서 표시, 시트 안에는 미표시 */
let tab=0,sel=0;
const list=()=>tab===0?TOOLS:DYN;
const fmt=(v,dec,unit)=>(dec?v.toFixed(dec):Math.round(v).toLocaleString())+unit;

/* ---------- render ---------- */
function renderStrip(){
  const s=document.getElementById('strip');s.innerHTML='';
  list().forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='slot'+(i===sel?' on':'')+(t.state!=='own'?' lock':'');
    d.onclick=()=>{sel=i;renderDetail();renderStrip();};
    d.innerHTML=`<img src="${t.icon}">`+
      (t.state!=='own'?`<img class="lk" src="${IMG.lock}">`:'')+
      (t.state==='lockOk'?`<img class="rd" src="${IMG.rd}">`:'')+
      (t.equip?`<span class="eq">장착</span>`:'')+
      (t.tmp?`<span class="tmp">임시</span>`:'');
    s.appendChild(d);
  });
}
function renderDetail(){
  const t=list()[sel];
  const owned=t.state==='own';
  document.getElementById('nm').innerHTML=t.n+(owned?`<small>능력치 개별 강화</small>`:`<small>미해금</small>`);

  const st=document.getElementById('st');st.innerHTML='';
  t.stats.forEach((p,i)=>{
    const icon=p.lb.includes('속도')||p.lb.includes('주기')?IMG.speed:(p.lb.includes('범위')?IMG.radius:IMG.power);
    const upgradable=p.inc!==null;
    const maxed=upgradable&&p.lv>=p.max;
    const now=fmt(p.v,p.dec,p.unit);
    const val=(owned&&upgradable&&!maxed)?`${now} ▸ <b>${fmt(p.v+p.inc,p.dec,p.unit)}</b>`:now;
    const lvTxt=upgradable?`LV ${p.lv}/${p.max}`:'고정';
    let btn;
    if(!owned)            btn=`<span class="fix">해금 후 강화</span>`;
    else if(!upgradable)  btn=`<span class="fix">—</span>`;
    else if(maxed)        btn=`<button class="ub maxed" disabled>MAX</button>`;
    else{
      const [cg,co]=p.cost, lack=cg>GOLD||co>ORE;
      btn=`<button class="ub${lack?' lack':''}" ${lack?'disabled':''} onclick="up(${i})">`+
          `<img src="${IMG.gold}">${cg.toLocaleString()}`+
          (co?`<img src="${IMG.ore}">${co}`:'')+`</button>`;
    }
    st.innerHTML+=`<div class="stat"><img src="${icon}">`+
      `<span class="lb">${p.lb}<i>${lvTxt}</i></span>`+
      `<span class="vl">${val}</span>${btn}</div>`;
  });

  /* 하단 버튼: 해금 전용 (업그레이드는 각 능력치 행에서 개별 진행) */
  const c=document.getElementById('cst'), a=document.getElementById('act');
  if(owned){
    c.innerHTML='';
    a.style.display='none';
  }else{
    const [cg,co]=t.unlock, lackG=cg>GOLD, lackO=co>ORE;
    c.innerHTML=`<div class="cost"><span class="${lackG?'lack':''}"><img src="${IMG.gold}">${cg.toLocaleString()}</span>`+
      (co?`<span class="${lackO?'lack':''}"><img src="${IMG.ore}">${co}</span>`:'')+`</div>`+
      (t.state==='lockCond'?`<div class="cond">${t.cond}</div>`:'');
    a.style.display='';
    a.textContent='해금';
    a.disabled=(t.state==='lockCond')||lackG||lackO;
    a.className='act unlock';
  }
}
function up(i){
  const p=list()[sel].stats[i];
  if(p.inc===null||p.lv>=p.max) return;
  p.lv++; p.v=+(p.v+p.inc).toFixed(4);
  renderDetail();
}
function doAct(){
  const t=list()[sel];
  if(t.state!=='own'){t.state='own';t.stats.forEach(p=>{if(p.inc!==null&&p.lv===0)p.lv=1;});}
  renderStrip();renderDetail();
}
function setTab(i){tab=i;sel=0;document.getElementById('tab0').className=i===0?'on':'';
  document.getElementById('tab1').className=i===1?'on':'';renderStrip();renderDetail();}
function openSheet(){document.getElementById('phA').classList.add('open','focus');}
function closeSheet(){document.getElementById('phA').classList.remove('open','focus');}

renderStrip();renderDetail();
</script>
